name: dev-vm

services:
  dev:
    image: mcr.microsoft.com/devcontainers/base:noble
    container_name: dev-vm
    hostname: dev-vm
    command: sleep infinity
    environment:
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
    ports:
      - "5001:5001"
      - "5173:5173"
    volumes:
      - ..:/workspace:cached
      - home:/home/vscode
      - claude:/home/vscode/.claude

volumes:
  home:
    name: dev-vm-home
  claude:
    name: dev-vm-claude
